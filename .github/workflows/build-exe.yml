name: Build EXE for Windows

on:
 workflow_dispatch:

jobs:
 build:
  runs-on: windows-latest
  
  steps:
   - name: Checkout code
     uses: actions/checkout@v3

   - name: Set up Python
     uses: actions/setup-python@v4
     with:
       python-version: 3.10

   - name: Install Pyinstaller and dependencies
     run: 
      pip install pyinstaller pandas
   
   - name: Build EXE
     run: pyinstaller --onefile --windowed --name=main main.py

   - name: Upload EXE
     uses: actions/upload-artifact@v4
     with:
       mame: nc_exe
       path: dist/nc.exe
      
